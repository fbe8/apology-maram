<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Maram ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="bgMusic" src="song.mp3" loop></audio>

  <div class="hearts" id="hearts"></div>

  <main class="card">
    <div class="intro" id="intro">
      <h1>مرومه حبيبتي ❤️</h1>
      <p>عندي شي أبي أقوله لج...</p>
      <button id="startBtn">افتحي الرسالة ❤️</button>
    </div>

    <section class="message hidden" id="messageBox">
      <h2>مرومه حبيبتي ❤️</h2>
      <p id="typedText"></p>
    </section>

    <section class="ending hidden" id="ending">
      <h1>أحبج يا مرومه ❤️</h1>
      <p>وأوعدج إني أبذل كل جهدي عشان أصير أحسن من قبل، وأعوضج عن كل لحظة ضيقة تسببت فيها. ❤️</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
